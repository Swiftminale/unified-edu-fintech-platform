version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: uefp-postgres
    restart: always
    environment:
      POSTGRES_USER: uefp_user
      POSTGRES_PASSWORD: uefp_password
      POSTGRES_DB: uefp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: uefp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2-alpine
    container_name: uefp-caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
